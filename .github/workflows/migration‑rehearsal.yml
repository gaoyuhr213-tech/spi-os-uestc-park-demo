name: Migration‑Rehearsal SPI‑OS
on:
  workflow_dispatch:

jobs:
  rehearsal-run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Prepare environment
        run: |
          echo "SPI‑OS Migration Rehearsal Start"

      - name: Run rehearsal scripts
        run: |
          if [ -d "./scripts/rehearsal/" ]; then
            ls -la ./scripts/rehearsal/
          fi
          if [ -d "./deploy/rehearsal/" ]; then
            ls -la ./deploy/rehearsal/
          fi

      - name: Rehearsal complete
        run: echo "✅ Migration rehearsal workflow finished"
